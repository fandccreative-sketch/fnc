<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>F & C Creative</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eeeeee;
        }

        .card {
            width: 380px;
            max-width: 90%;
            background: white;
            border-radius: 22px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #111111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
        }

            .logo img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        h1 {
            margin: 0;
            font-size: 27px;
        }

        .subtitle {
            margin-top: 8px;
            color: #777;
            font-size: 15px;
        }

        .contact-info {
            margin-top: 30px;
        }

        .contact {
            display: block;
            text-decoration: none;
            color: #222;
            padding: 15px;
            margin: 10px 0;
            background: #f5f5f5;
            border-radius: 12px;
            font-size: 16px;
        }

            .contact:hover {
                background: #e9e9e9;
            }

        .save {
            width: 100%;
            border: none;
            padding: 16px;
            margin-top: 20px;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

            .save:hover {
                background: #333;
            }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>


<body>

    <div class="card">

        <!-- LOGO -->
        <div class="logo">
            <img src="logo.png" alt="F & C Creative Logo">
        </div>

        <!-- BUSINESS NAME -->
        <h1>Lara Allysa Padilla</h1>

        <div class="subtitle">
            Sales Executive
        </div>


        <!-- CONTACT INFORMATION -->

        <div class="contact-info">

            <!-- PHONE -->
            <a class="contact" href="tel:(+63)9985746369">
                📞 (+63) 998 574 6369
            </a>

            <!-- EMAIL -->
            <a class="contact"
               href="mailto:boracayuptown1@yahoo.com?subject=Sales%20Inquiry&body=Dear%20Lara%20Padilla%2C%0A%0AI%20would%20like%20to%20make%20an%20inquiry.%0A%0AName%3A%20%0AContact%20Number%3A%20%0AInquiry%3A%20%0A%0AThank%20you.">
                ✉️ boracayuptown1@yahoo.com
            </a>

        </div>


    </div>


 

</body>
</html>
